[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojasx-verified-core"
version = "0.3.0"
description = "PyTorch activation-memory research backend with mathematical specifications, optional CPU/Metal kernels and experimental TCP partitions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.8,<2.9", "numpy>=1.26", "z3-solver>=4.13", "sympy>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["pandas>=2", "pyarrow>=15", "expecttest>=0.2", "hypothesis>=6"]

[project.scripts]
ojasx-verify = "ojasx2.cli:main"

[project.entry-points."torch_dynamo_backends"]
holonomic = "ojasx2.holonomic_math_compiler:holonomic_backend"
holonomic_aot = "ojasx2.aot_holonomic_compiler:holonomic_aot_backend"

[tool.setuptools.packages.find]
include = ["ojasx2*"]

[tool.setuptools.package-data]
ojasx2 = [
    "codegen/*.yaml",
    "csrc/*.cpp",
    "csrc/*.mm",
    "csrc/*.h",
    "csrc/*.dylib",
    "csrc/*.so",
    "csrc/*.pyd",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

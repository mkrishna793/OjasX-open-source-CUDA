[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojasx-verified-core"
version = "0.2.0"
description = "Formally Certified Holonomic Cotangent Invariant Calculus (HCIC) Backend & Compiler for PyTorch 2.x"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.8,<2.9", "z3-solver>=4.13", "sympy>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ojasx-verify = "ojasx2.cli:main"

[project.entry-points."torch_dynamo_backends"]
holonomic = "ojasx2.holonomic_math_compiler:holonomic_backend"
holonomic_aot = "ojasx2.aot_holonomic_compiler:holonomic_aot_backend"

[tool.setuptools.packages.find]
include = ["ojasx2*"]

[tool.setuptools.package-data]
ojasx2 = ["codegen/*.yaml", "csrc/*.cpp", "csrc/*.dylib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

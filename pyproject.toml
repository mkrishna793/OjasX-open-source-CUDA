[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ojasx-verified-core"
version = "0.7.0"
description = "OjasX: Open-source math-level PyTorch training & memory-optimization compiler with Lean/Rocq specs, C++/Metal kernels, and TCP sharding"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mohana Krishna" }]
keywords = ["pytorch", "compiler", "autograd", "memory-optimization", "metal", "apple-silicon", "lean4", "coq", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4", "numpy>=1.24", "z3-solver>=4.12", "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/mkrishna793/OjasX-open-source-CUDA"
Repository = "https://github.com/mkrishna793/OjasX-open-source-CUDA"
Issues = "https://github.com/mkrishna793/OjasX-open-source-CUDA/issues"
Releases = "https://github.com/mkrishna793/OjasX-open-source-CUDA/releases"

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["pandas>=2", "pyarrow>=15", "expecttest>=0.2", "hypothesis>=6"]

[project.scripts]
ojasx-verify = "ojasx2.cli:main"
ojasx-doctor = "ojasx2.doctor:main"

[project.entry-points."torch_dynamo_backends"]
holonomic = "ojasx2.holonomic_math_compiler:holonomic_backend"
holonomic_aot = "ojasx2.aot_holonomic_compiler:holonomic_aot_backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["ojasx2", "ojasx2.*"]
exclude = ["third_party*", "tests*", "reports*", "rocq*", "lean*"]

[tool.setuptools.package-data]
ojasx2 = [
    "codegen/*.yaml",
    "csrc/*.cpp",
    "csrc/*.mm",
    "csrc/*.h",
    "csrc/*.dylib",
    "csrc/*.so",
    "csrc/*.pyd",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

name: OjasX Continuous Integration & Math Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Property Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy z3-solver sympy pytest
          pip install -e .

      - name: Run Exhaustive Mathematical Tests & CI Verification
        run: |
          pytest tests/test_v011_5_findings.py \
                 tests/test_ojasx_exhaustive.py \
                 tests/test_tilelang_and_root_e8.py \
                 tests/test_e8_lattice.py \
                 tests/test_dagger_attention.py \
                 tests/test_fused_cross_entropy.py \
                 tests/test_symplectic_numerical_mechanics.py \
                 tests/test_z3_symplectic_stability.py \
                 -v

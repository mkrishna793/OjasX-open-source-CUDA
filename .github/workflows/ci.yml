name: OjasX Continuous Integration & Math Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit & Property Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*" || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy z3-solver sympy pytest
          pip install -e .

      - name: Run Exhaustive Mathematical Tests & CI Verification
        env:
          PYTHONPATH: .
          CI: "true"
          OJASX_DISABLE_UPDATE_CHECK: "1"
        run: |
          set -o pipefail
          python -m pytest tests/test_v011_5_findings.py \
                           tests/test_ojasx_exhaustive.py \
                           tests/test_tilelang_and_root_e8.py \
                           tests/test_e8_lattice.py \
                           tests/test_dagger_attention.py \
                           tests/test_fused_cross_entropy.py \
                           tests/test_symplectic_numerical_mechanics.py \
                           tests/test_z3_symplectic_stability.py \
                           -v --tb=short 2>&1 | tee test_run.log

      - name: Annotate Failure
        if: failure()
        run: |
          tail -n 60 test_run.log | while IFS= read -r line; do
            echo "::error title=Pytest::$line"
          done

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Test Execution Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Push Test Log to git branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f test_run.log
          git commit -m "ci: capture test run log [skip ci]" || true
          git push --force origin ci-log || true

      - name: Upload Test Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: test_run.log

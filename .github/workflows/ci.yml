name: OjasX Continuous Integration & Math Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full CPU Tests & Scoped Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install declared runtime and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,benchmark]'

      - name: Run complete CPU test suite
        env:
          PYTHONPATH: .
          CI: "true"
          OJASX_DISABLE_UPDATE_CHECK: "1"
          OJASX_BUILD_NATIVE: "0"
          OJASX_DISABLE_NATIVE: "1"
        run: |
          set -o pipefail
          python -m pytest -q --tb=short --junitxml=test-results.xml 2>&1 | tee test_run.log

      - name: Annotate Failure
        if: failure()
        run: |
          python -c '
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse("test-results.xml")
              for tc in tree.findall(".//testcase"):
                  for fail in tc.findall("failure"):
                      name = f"{tc.attrib.get(\"classname\", \"\")}.{tc.attrib.get(\"name\", \"\")}"
                      msg = fail.attrib.get("message", "Test failed").replace("\n", " ")
                      print(f"::error title=TestFailure::{name} -> {msg}")
          except Exception as e:
              print(f"Error parsing xml: {e}")
          '
          echo "=== Pytest Failures and Tracebacks ==="
          python -c '
          try:
              with open("test_run.log") as f:
                  content = f.read()
              if "FAILURES" in content:
                  print(content[content.index("FAILURES"):])
              elif "ERRORS" in content:
                  print(content[content.index("ERRORS"):])
              else:
                  print(content[-3000:])
          except Exception as e:
              print(e)
          '

      - name: Run scoped symbolic, source, codegen, and documentation gates
        env:
          OJASX_BUILD_NATIVE: "0"
        run: |
          python tools/verify_remediation_z3.py
          python tools/check_markdown_links.py --json reports/markdown-link-check.json
          python ojasx2/codegen/gen_holonomic_ops.py --check
          python tools/verify_static_and_symbolic.py

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Test Execution Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 test_run.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results-${{ matrix.python-version }}
          path: |
            test_run.log
            test-results.xml
            reports/remediation-z3.json
            reports/markdown-link-check.json

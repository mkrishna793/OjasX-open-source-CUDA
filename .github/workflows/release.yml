name: Official OjasX Release & Package Publisher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Wheel/SDist & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Portable Wheel (.whl) and Source Distribution (.tar.gz)
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          python -m build --sdist --wheel --outdir dist/
          ls -lh dist/

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OjasX ${{ github.ref_name }} — Math-Level PyTorch Training & Memory Compiler"
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## OjasX ${{ github.ref_name }} Official Release

            ### Quick Install Directly in PyTorch
            ```bash
            # Option 1: Install directly from the release tag via git
            pip install git+https://github.com/mkrishna793/OjasX-open-source-CUDA.git@${{ github.ref_name }}
            ```

            ### Drop-In 1-Line PyTorch Usage (OjasX v12)
            ```python
            import torch
            import ojasx

            # 1-Line Zero-RAM Setup (auto-replaces attention, quantizes moments in 2-bit E8)
            model, optimizer = ojasx.prepare(model, lr=1e-4)

            for x, y in dataloader:
                optimizer.zero_grad()
                loss = ojasx.loss(model(x), y)  # Streaming Zero-DRAM Cross-Entropy!
                loss.backward()
                optimizer.step()
            ```
